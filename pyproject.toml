[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentfork"
version = "0.1.0"
description = "Restore-validated Btrfs and CRIU checkpoints for branching agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.10,<4", "httpx>=0.27,<1", "PyYAML>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2"]
benchmark = ["harbor==0.20.0"]

[project.scripts]
agentfork = "agentfork.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentfork", "agentfork_sandbox"]

[tool.hatch.build.targets.sdist]
include = ["agentfork", "agentfork_sandbox", "runtime", "tests", "examples", "scripts", "docs", "README*", "LICENSE", "NOTICE", "THIRD_PARTY.md", "pyproject.toml", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires explicitly configured rootful Podman, CRIU and Btrfs"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
